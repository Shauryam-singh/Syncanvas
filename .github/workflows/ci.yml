name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and serve the client
        run: |
          npm run build:shared
          npm run build -w @syncanvas/client

      - name: Run the browser smoke test
        env:
          # The runner ships Google Chrome; playwright's channel resolves it
          # to /opt/google/chrome/chrome. The bundled Chromium is not
          # installed, so no executablePath may be passed.
          SMOKE_CHANNEL: chrome
        run: |
          npm run preview -w @syncanvas/client -- --port 5173 &
          npx wait-on http://localhost:5173 --timeout 60000
          npm run smoke

  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the client and the gateway
        run: |
          npm run build:shared
          npm run build -w @syncanvas/client
          npm run build -w @syncanvas/server

      - name: Run the two-browser sync test
        env:
          SMOKE_CHANNEL: chrome
        run: |
          # The test starts the gateway itself — it has to be able to restart
          # it to check that the clients reconnect.
          npm run preview -w @syncanvas/client -- --port 5173 &
          npx wait-on http://localhost:5173 --timeout 60000
          npm run smoke:sync
