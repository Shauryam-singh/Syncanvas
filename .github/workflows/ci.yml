name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syncanvas
          POSTGRES_PASSWORD: syncanvas
          POSTGRES_DB: syncanvas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncanvas -d syncanvas_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          # Runs the Postgres integration tests as well as the in-memory suites.
          TEST_DATABASE_URL: postgres://syncanvas:syncanvas@localhost:5432/syncanvas_test
        run: npm run test

      - name: Build
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and serve the client
        run: |
          npm run build:shared
          npm run build -w @syncanvas/client

      - name: Run the browser smoke test
        env:
          # The runner ships Google Chrome; playwright's channel resolves it
          # to /opt/google/chrome/chrome. The bundled Chromium is not
          # installed, so no executablePath may be passed.
          SMOKE_CHANNEL: chrome
        run: |
          npm run preview -w @syncanvas/client -- --port 5173 &
          npx wait-on http://localhost:5173 --timeout 60000
          npm run smoke

  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syncanvas
          POSTGRES_PASSWORD: syncanvas
          POSTGRES_DB: syncanvas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncanvas -d syncanvas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the client and the gateway
        run: |
          npm run build:shared
          npm run build -w @syncanvas/client
          npm run build -w @syncanvas/server

      - name: Run the multi-user sync test
        env:
          SMOKE_CHANNEL: chrome
          # Durable rooms are what the restart phase checks. Without these the
          # gateway falls back to the memory store and the script explicitly
          # skips the persistence assertions.
          STORE: postgres
          DATABASE_URL: postgres://syncanvas:syncanvas@localhost:5432/syncanvas
          JWT_SECRET: ci-smoke-secret
        run: |
          # The test starts the gateway itself — it has to be able to restart
          # it to check that the clients reconnect.
          npm run preview -w @syncanvas/client -- --port 5173 &
          npx wait-on http://localhost:5173 --timeout 60000
          npm run smoke:sync

  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syncanvas
          POSTGRES_PASSWORD: syncanvas
          POSTGRES_DB: syncanvas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncanvas -d syncanvas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the client and the gateway
        run: |
          npm run build:shared
          npm run build -w @syncanvas/client
          npm run build -w @syncanvas/server

      - name: Run the two-gateway failover test
        env:
          SMOKE_CHANNEL: chrome
          DATABASE_URL: postgres://syncanvas:syncanvas@localhost:5432/syncanvas
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-scale-smoke-secret
        run: |
          npm run preview -w @syncanvas/client -- --port 4173 &
          npx wait-on http://localhost:4173 --timeout 60000
          npm run smoke:scale
