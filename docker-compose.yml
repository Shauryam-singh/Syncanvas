services:
  postgres:
    image: postgres:16-alpine
    container_name: syncanvas-postgres
    environment:
      POSTGRES_USER: syncanvas
      POSTGRES_PASSWORD: syncanvas
      POSTGRES_DB: syncanvas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U syncanvas -d syncanvas']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: syncanvas-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  gateway-a:
    profiles: ['scale']
    build:
      context: .
      target: gateway
    environment:
      PORT: 8080
      STORE: postgres
      DATABASE_URL: postgres://syncanvas:syncanvas@postgres:5432/syncanvas
      REDIS_URL: redis://redis:6379
      INSTANCE_ID: gateway-a
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
      PUBLIC_DEMO_ROOM: ${PUBLIC_DEMO_ROOM:-demo}
      SNAPSHOT_EVERY: ${SNAPSHOT_EVERY:-100}
      SNAPSHOT_INTERVAL_MS: ${SNAPSHOT_INTERVAL_MS:-60000}
    ports:
      - '8101:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  gateway-b:
    profiles: ['scale']
    build:
      context: .
      target: gateway
    environment:
      PORT: 8080
      STORE: postgres
      DATABASE_URL: postgres://syncanvas:syncanvas@postgres:5432/syncanvas
      REDIS_URL: redis://redis:6379
      INSTANCE_ID: gateway-b
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret}
      PUBLIC_DEMO_ROOM: ${PUBLIC_DEMO_ROOM:-demo}
      SNAPSHOT_EVERY: ${SNAPSHOT_EVERY:-100}
      SNAPSHOT_INTERVAL_MS: ${SNAPSHOT_INTERVAL_MS:-60000}
    ports:
      - '8102:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    profiles: ['scale']
    build:
      context: .
      target: web
    ports:
      - '8080:80'
    depends_on:
      gateway-a:
        condition: service_healthy
      gateway-b:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
