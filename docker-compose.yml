services:
  postgres:
    image: postgres:16-alpine
    container_name: syncanvas-postgres
    environment:
      POSTGRES_USER: syncanvas
      POSTGRES_PASSWORD: syncanvas
      POSTGRES_DB: syncanvas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U syncanvas -d syncanvas']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: syncanvas-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
