worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # WebSocket upgrades need the upstream connection kept open; ordinary HTTP
  # requests can share keepalive connections instead.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream syncanvas_gateway {
    least_conn;
    server gateway-a:8080 max_fails=2 fail_timeout=5s;
    server gateway-b:8080 max_fails=2 fail_timeout=5s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The built client is a single-page app: unknown paths are client routes.
    location / {
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      proxy_pass http://syncanvas_gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location = /healthz {
      proxy_pass http://syncanvas_gateway/healthz;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # A WebSocket lives for the whole editing session, so it must not be
    # buffered and its read timeout must outlast idle periods.
    location /ws {
      proxy_pass http://syncanvas_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 2s;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }
}
